[workspace]
name = "rusmium"
version = "0.1.0"
description = "Idiomatic Rust bindings for the libosmium C++ OpenStreetMap library"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[tasks]
build = "cargo build"
test = "cargo test"
roundtrip = "cargo test --test roundtrip"
# Release: the extract is a bulk data job, and a debug build of the Rust side
# costs several times the wall clock on a real-world file.
example-bbox = "cargo run --release --example bbox_filter --"
bench-bbox = "bash scripts/bench_bbox.sh"
fmt = "cargo fmt --check"
lint = "cargo clippy --all-targets -- -D warnings"

# Everything needed to build and run the crate. Anyone consuming rusmium from
# source needs exactly this set and nothing more.
[dependencies]
# Header-only C++ libraries providing the OSM data model and PBF codec.
libosmium = "*"
protozero = "*"
# Native libraries libosmium links against for compression and XML parsing.
zlib = "*"
expat = "*"
bzip2 = "*"
lz4 = "*"
# Toolchain: a C++ compiler ABI-matched to the conda-built libraries above,
# plus the Rust toolchain, so the whole build is reproducible from the lockfile.
cxx-compiler = "*"
rust = "*"

# Tooling only contributors need. Kept out of the default environment so a
# plain `pixi install` stays lean.
[feature.dev.dependencies]
# Drop-in pre-commit replacement, reads .pre-commit-config.yaml.
prek = ">=0.4.11,<0.5"

[feature.dev.tasks]
# Install the git hooks once per clone.
hooks = "prek install --hook-type pre-commit --hook-type pre-push"
# Run every pre-commit-stage hook over the whole tree, as CI does.
check = "prek run --all-files"

[environments]
# One solve group so both environments resolve to identical package versions.
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
