name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, clippy and the file hygiene hooks all run through prek, so CI
  # enforces exactly what a contributor's pre-commit hook does — one definition
  # in .pre-commit-config.yaml rather than two that can drift apart.
  checks:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # Match the pixi that generated pixi.lock (lock format v7).
          pixi-version: v0.75.0
          environments: dev
          # Fail if the lockfile is out of date with pixi.toml.
          frozen: true
          cache: true

      - name: Run pre-commit hooks
        run: pixi run -e dev check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest -> linux-64, macos-latest -> osx-arm64.
        # Both platforms are pinned in pixi.lock.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.75.0
          # Only the build/runtime dependencies; the dev tooling is not needed
          # here and would be a wasted download on both matrix legs.
          environments: default
          frozen: true
          cache: true

      - name: Test
        run: pixi run test
